[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-flight-recorder"
version = "0.1.0"
description = "A black box for AI agents: audit traces for unsafe actions, false success claims and invented facts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shalu Kumari"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
afr = "agent_flight_recorder.cli:main"

[tool.setuptools]
packages = ["agent_flight_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
